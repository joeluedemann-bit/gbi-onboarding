# KI-Entwickler: setzt Änderungswünsche aus Issues um, testet sie und öffnet einen Pull Request.
#
# Auslöser:
#   - Issue mit dem Label „ki-entwickler“ (z. B. über die Vorlage „Änderungswunsch“)
#   - Kommentar mit „@claude“ in einem Issue oder Pull Request (Rückfragen, Nachbesserungen)
#
# Voraussetzung: Repository-Secret ANTHROPIC_API_KEY.
# Die Arbeitsregeln des Bots stehen in CLAUDE.md.
name: KI-Entwickler

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ki-entwickler-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  entwickeln:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ki-entwickler')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: KI-Entwickler ausführen
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: ki-entwickler
          trigger_phrase: "@claude"
          branch_prefix: ki/
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm ci),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npx tsc:*),Bash(npx vitest:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh issue view:*)"
